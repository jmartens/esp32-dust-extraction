name: Firmware build

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    name: Detect firmware build system
    runs-on: ubuntu-latest
    outputs:
      has_build: ${{ steps.build-system.outputs.has_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for firmware build manifest
        id: build-system
        shell: bash
        run: |
          if test -f firmware/CMakeLists.txt; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ESP-IDF firmware
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5@sha256:00e94c6ff8bc1f7bd22b234ff43db3f3056cb33dedac6819df9fbedbcb5c6ebb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        working-directory: firmware
        run: idf.py build

  not-configured:
    name: Build system not configured
    needs: detect
    if: needs.detect.outputs.has_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred build
        run: echo "No firmware/CMakeLists.txt is committed yet; firmware build validation remains deferred."

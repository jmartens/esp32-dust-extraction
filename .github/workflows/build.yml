name: Firmware build

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  detect:
    name: Detect firmware build system
    runs-on: ubuntu-latest
    outputs:
      has_build: ${{ steps.build-system.outputs.has_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for firmware build manifest
        id: build-system
        shell: bash
        run: |
          if test -f firmware/CMakeLists.txt; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ESP-IDF firmware
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore ESP-IDF ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-esp32-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-esp32-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-
            ${{ runner.os }}-esp32-

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1.1
          target: esp32
          path: firmware
          extra_docker_args: -e IDF_CCACHE_ENABLE=1 -e CCACHE_DIR=/ccache -v ${{ github.workspace }}/.ccache:/ccache

  host-tests:
    name: Run host unit tests
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore host-test ESP-IDF ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-host-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-host-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-
            ${{ runner.os }}-host-

      - name: Run ESP-IDF unit tests on Linux
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1.1
          target: linux
          path: firmware/test
          command: bash ./run_coverage.sh
          extra_docker_args: -e IDF_CCACHE_ENABLE=1 -e CCACHE_DIR=/ccache -v ${{ github.workspace }}/.ccache:/ccache

      - name: Publish coverage summary
        if: always() && hashFiles('firmware/test/coverage/summary.txt') != ''
        shell: bash
        run: |
          {
            echo '## Host unit-test coverage'
            echo '```'
            cat firmware/test/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('firmware/test/coverage/coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-test-coverage
          path: firmware/test/coverage/

      - name: Upload SonarQube analysis inputs
        if: >-
          success() &&
          hashFiles('firmware/test/coverage/sonarqube.xml') != '' &&
          hashFiles('firmware/test/build/compile_commands.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-analysis-inputs
          path: |
            firmware/test/coverage/sonarqube.xml
            firmware/test/build/compile_commands.json

  sonarqube-analysis:
    name: Analyze coverage with SonarQube Cloud
    needs: [detect, host-tests]
    if: >-
      needs.detect.outputs.has_build == 'true' &&
      needs.host-tests.result == 'success' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download SonarQube analysis inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-analysis-inputs
          path: firmware/test

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Authenticate to SonarQube Cloud with GitHub OIDC
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        with:
          export-env: false

      - name: Run SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
          SONAR_ORGANIZATION: ${{ steps.sonar-auth.outputs.organization }}
          SONAR_PROJECT_KEY: ${{ steps.sonar-auth.outputs.project-key }}
          SONAR_REGION: ${{ steps.sonar-auth.outputs.sonar-region }}
        shell: bash
        run: |
          mkdir -p "$HOME/.sonar/cache"
          docker run --rm \
            -e SONAR_TOKEN \
            -e SONAR_ORGANIZATION \
            -e SONAR_PROJECT_KEY \
            -e SONAR_REGION \
            -e GITHUB_ACTIONS \
            -e GITHUB_WORKFLOW \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_NUMBER \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_REPOSITORY \
            -e GITHUB_REF \
            -e GITHUB_SHA \
            -e GITHUB_HEAD_REF \
            -e GITHUB_BASE_REF \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_WORKSPACE=/app/$GITHUB_REPOSITORY \
            -e GITHUB_EVENT_PATH=/tmp/github-event.json \
            -v "$GITHUB_WORKSPACE:/app/$GITHUB_REPOSITORY" \
            -v "$GITHUB_EVENT_PATH:/tmp/github-event.json:ro" \
            -v "$HOME/.sonar/cache:/root/.sonar/cache" \
            -w "/app/$GITHUB_REPOSITORY" \
            espressif/idf:v6.1 \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update
              apt-get install --yes --no-install-recommends curl default-jre-headless unzip
              curl --fail --silent --show-error --location \
                https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.4.0.16527-linux-x64.zip \
                --output /tmp/sonar-scanner.zip
              unzip -q /tmp/sonar-scanner.zip -d /tmp
              /tmp/sonar-scanner-8.4.0.16527-linux-x64/bin/sonar-scanner \
                -Dsonar.organization="$SONAR_ORGANIZATION" \
                -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
                -Dsonar.sources=firmware/components,firmware/main \
                -Dsonar.exclusions="**/test/**,**/build/**,**/managed_components/**" \
                -Dsonar.cfamily.compile-commands=firmware/test/build/compile_commands.json \
                -Dsonar.coverageReportPaths=firmware/test/coverage/sonarqube.xml
            '

name: Firmware build

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  detect:
    name: Detect firmware build system
    runs-on: ubuntu-latest
    outputs:
      has_build: ${{ steps.build-system.outputs.has_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for firmware build manifest
        id: build-system
        shell: bash
        run: |
          if test -f firmware/CMakeLists.txt; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ESP-IDF firmware
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore ESP-IDF ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-esp32-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-esp32-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-
            ${{ runner.os }}-esp32-

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware
          extra_docker_args: -e IDF_CCACHE_ENABLE=1 -e CCACHE_DIR=/ccache -v ${{ github.workspace }}/.ccache:/ccache

  host-tests:
    name: Run host unit tests
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore host-test ESP-IDF ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-host-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-host-${{ hashFiles('firmware/**/CMakeLists.txt', 'firmware/**/idf_component.yml', 'firmware/sdkconfig*') }}-
            ${{ runner.os }}-host-

      - name: Run ESP-IDF unit tests on Linux
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1
          target: linux
          path: firmware/test
          command: bash ./run_coverage.sh
          extra_docker_args: -e IDF_CCACHE_ENABLE=1 -e CCACHE_DIR=/ccache -v ${{ github.workspace }}/.ccache:/ccache

      - name: Publish coverage summary
        if: always() && hashFiles('firmware/test/coverage/summary.txt') != ''
        shell: bash
        run: |
          {
            echo '## Host unit-test coverage'
            echo '```'
            cat firmware/test/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('firmware/test/coverage/coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-test-coverage
          path: firmware/test/coverage/

      - name: Comment coverage on pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('firmware/test/coverage/summary.txt') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- host-test-coverage -->'
          {
            echo "$marker"
            echo '## Host unit-test coverage'
            echo '```'
            cat firmware/test/coverage/summary.txt
            echo '```'
            echo "Full HTML/XML report: \`host-test-coverage\` artifact on the [workflow run]($RUN_URL)."
          } > comment.md
          comment_id="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))][0].id // empty" | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md
          fi

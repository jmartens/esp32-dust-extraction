name: Firmware build

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP-IDF firmware
    if: hashFiles('firmware/CMakeLists.txt') != ''
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        working-directory: firmware
        run: idf.py build

  not-configured:
    name: Build system not configured
    if: hashFiles('firmware/CMakeLists.txt') == ''
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred build
        run: echo "No firmware/CMakeLists.txt is committed yet; firmware build validation remains deferred."

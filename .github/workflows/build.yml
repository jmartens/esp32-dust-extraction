name: Firmware build

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    name: Detect firmware build system
    runs-on: ubuntu-latest
    outputs:
      has_build: ${{ steps.build-system.outputs.has_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for firmware build manifest
        id: build-system
        shell: bash
        run: |
          if test -f firmware/CMakeLists.txt; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ESP-IDF firmware
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware

  host-tests:
    name: Run host unit tests
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run ESP-IDF unit tests on Linux
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1
          target: linux
          path: firmware/test
          command: idf.py --preview set-target linux && idf.py build && ./build/open_extraction_tests.elf

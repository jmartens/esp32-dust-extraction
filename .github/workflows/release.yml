name: Release

on:
  push:
    branches:
      - main
      - 'hotfix/*'
      - 'release/*'
  workflow_dispatch:

jobs:
  release:
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/') || startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware

      - name: Package flashable firmware
        run: |
          python3 scripts/package_esp32_release.py \
            --build-dir firmware/build \
            --output-dir dist/esp32-firmware \
            --commit "$GITHUB_SHA"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          # prefer a user-provided RELEASE_GITHUB_TOKEN; fallback to built-in GITHUB_TOKEN
          export GITHUB_TOKEN="${RELEASE_GITHUB_TOKEN:-$GITHUB_TOKEN}"

          # npx must install every plugin referenced in .releaserc.json alongside semantic-release
          npx -y \
            -p semantic-release@22 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/git@10 \
            -p @semantic-release/github@9 \
            -p conventional-changelog-conventionalcommits@7 \
            semantic-release

name: Release

on:
  push:
    branches:
      - main
      - 'hotfix/*'
      - 'release/*'
      - develop
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          # prefer a user-provided RELEASE_GITHUB_TOKEN; fallback to built-in GITHUB_TOKEN
          export GITHUB_TOKEN="${RELEASE_GITHUB_TOKEN:-$GITHUB_TOKEN}"

          # Use npx to avoid committing package.json; install ephemeral packages as needed
          npx -y semantic-release
